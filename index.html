<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruble-Easy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.taddy.pro/web/taddy.min.js" data-pub-id="ebfc11641be2dcc4d9f236bbd41b89f3"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center;
        }
        h1 { margin-bottom: 8px; font-size: 32px; }
        p { color: #888; margin-bottom: 40px; font-size: 15px; }
        .watch-btn {
            padding: 20px 48px; font-size: 18px; font-weight: bold;
            border-radius: 14px; border: none;
            background: linear-gradient(135deg, #2481cc, #1a5f9e);
            color: white; cursor: pointer;
            box-shadow: 0 6px 16px rgba(36, 129, 204, 0.35);
            transition: transform 0.1s;
        }
        .watch-btn:active { transform: scale(0.97); }
        .watch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 24px; font-size: 14px; color: #888; min-height: 20px; }
    </style>
</head>
<body>
    <h1>💰 Ruble-Easy</h1>
    <p>Смотри рекламу и зарабатывай монеты</p>
    <button class="watch-btn" id="watchAdButton">▶️ Смотреть рекламу</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const taddy = window.Taddy;
        taddy.ready();

        const watchAdButton = document.getElementById('watchAdButton');
        const statusEl = document.getElementById('status');

        watchAdButton.addEventListener('click', () => {
            watchAdButton.disabled = true;
            statusEl.textContent = 'Загрузка рекламы...';

            const ads = taddy.ads();
            ads.interstitial({
                onClosed: () => {
                    console.log('Ad closed by user');
                },
                onViewThrough: (id) => {
                    console.log('Ad viewed fully! ID:', id);
                    statusEl.textContent = '✅ Награда начисляется, окно закроется...';
                    setTimeout(() => {
                        tg.close();
                    }, 1200);
                }
            }).then((success) => {
                if (success) {
                    console.log('Ad shown');
                } else {
                    statusEl.textContent = '❌ Реклама недоступна. Попробуйте позже.';
                    watchAdButton.disabled = false;
                }
            }).catch((err) => {
                console.error('Ad error:', err);
                statusEl.textContent = '❌ Ошибка загрузки рекламы.';
                watchAdButton.disabled = false;
            });
        });
    </script>
</body>
</html>
