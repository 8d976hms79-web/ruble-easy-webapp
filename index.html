<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruble-Easy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Taddy SDK -->
    <script src="https://sdk.taddy.pro/web/taddy.min.js?1317" data-pub-id="ebfc11641be2dcc4d9f236bbd41b89f3"></script>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center;
        }
        h1 { margin-bottom: 8px; font-size: 32px; }
        p { color: #888; margin-bottom: 30px; font-size: 15px; }
        .ad-block { width: 100%; max-width: 320px; margin-bottom: 16px; }
        .ad-label {
            font-size: 12px; color: #666; margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .watch-btn {
            width: 100%; padding: 18px 24px; font-size: 17px; font-weight: bold;
            border-radius: 14px; border: none; color: white; cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); transition: transform 0.1s;
        }
        .watch-btn:active { transform: scale(0.97); }
        .watch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-taddy { background: linear-gradient(135deg, #2481cc, #1a5f9e); }
        .btn-adsgram { background: linear-gradient(135deg, #ff6b35, #d84315); }
        #status { margin-top: 20px; font-size: 14px; color: #888; min-height: 20px; }
    </style>
</head>
<body>
    <h1>💰 Ruble-Easy</h1>
    <p>Смотри рекламу и зарабатывай монеты</p>

    <div class="ad-block">
        <div class="ad-label">Реклама 1</div>
        <button class="watch-btn btn-taddy" id="watchTaddyBtn">▶️ Смотреть рекламу</button>
    </div>

    <div class="ad-block">
        <div class="ad-label">Реклама 2</div>
        <button class="watch-btn btn-adsgram" id="watchAdsgramBtn">▶️ Смотреть рекламу</button>
    </div>

    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const taddy = window.Taddy;
        taddy.ready();

        const statusEl = document.getElementById('status');

        // ============ КНОПКА 1: TADDY ============
        const watchTaddyBtn = document.getElementById('watchTaddyBtn');
        watchTaddyBtn.addEventListener('click', () => {
            watchTaddyBtn.disabled = true;
            statusEl.textContent = 'Загрузка рекламы Taddy...';
            const ads = taddy.ads();
            ads.interstitial({
                onClosed: () => console.log('Taddy ad closed'),
                onViewThrough: (id) => {
                    statusEl.textContent = '✅ Награда начисляется...';
                    setTimeout(() => tg.close(), 1200);
                }
            }).then((success) => {
                if (!success) {
                    statusEl.textContent = '❌ Реклама недоступна.';
                    watchTaddyBtn.disabled = false;
                }
            }).catch(() => {
                statusEl.textContent = '❌ Ошибка рекламы Taddy.';
                watchTaddyBtn.disabled = false;
            });
        });

        // ============ КНОПКА 2: ADSGRAM ============
        const watchAdsgramBtn = document.getElementById('watchAdsgramBtn');

        let AdController = null;
        if (window.Adsgram) {
            try {
                AdController = window.Adsgram.init({ blockId: "int-47785" });
            } catch (e) {
                console.log('Format 1 (int-47785) failed, trying format 2...');
                try {
                    AdController = window.Adsgram.init({ blockId: "47785" });
                } catch (e2) {
                    console.error('Both formats failed:', e2);
                }
            }
        }

        watchAdsgramBtn.addEventListener('click', () => {
            if (!AdController) {
                statusEl.textContent = '❌ AdsGram не загружен.';
                return;
            }

            watchAdsgramBtn.disabled = true;
            statusEl.textContent = 'Загрузка рекламы AdsGram...';

            AdController.show().then((result) => {
                if (result.done) {
                    console.log('AdsGram ad viewed!');
                    statusEl.textContent = '✅ Награда начисляется...';
                    setTimeout(() => tg.close(), 1200);
                } else {
                    statusEl.textContent = '❌ Реклама не просмотрена до конца.';
                    watchAdsgramBtn.disabled = false;
                }
            }).catch((err) => {
                console.error('AdsGram error:', err);
                statusEl.textContent = '❌ Реклама недоступна. Попробуйте позже.';
                watchAdsgramBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
